{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="{% static 'app.css' %}" rel="stylesheet">

    <style>
        :root {
            --app-header-height: 0px;
            --app-footer-height: 0px;
        }

        body {
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            background: url("{% static '666.jpg' %}") no-repeat center center fixed;
            background-size: cover;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 0;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body>
    <div class="auth-overlay"></div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4" style="position:relative; z-index:1;">
        <div class="card card-shadow auth-card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-flex justify-content-center mb-2">
                        {% if site_appearance and site_appearance.logo %}
                        <img src="{{ site_appearance.logo.url }}" alt="logo" style="max-height:58px; object-fit:contain;">
                        {% else %}
                        <span class="brand-badge">BRB</span>
                        {% endif %}
                    </div>
                    <h4 class="mb-1">تسجيل الدخول</h4>
                    <div class="text-muted small">ادخل بياناتك للمتابعة</div>
                </div>

                {% if messages %}
                    <div class="mb-3">
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags|default:'info' }} py-2 mb-2" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label class="form-label">اسم المستخدم</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" autocomplete="username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">كلمة المرور</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        دخول
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
