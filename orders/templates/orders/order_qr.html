{% extends "base.html" %}
{% block title %}QR شحنات{% endblock %}
{% block header_action %}{% url 'orders:list' %}{% endblock %}
{% block content %}
<h4 class="mb-3">رمز QR للشحنات المحددة</h4>
<div class="row g-3">
    {% for row in rows %}
    <div class="col-6 col-md-4 col-lg-3 text-center">
        <div class="card card-shadow h-100 p-2">
            <img src="{{ row.qr_png_url }}" alt="QR" class="img-fluid mb-2" width="120" height="120" loading="lazy">
            <div class="small fw-semibold">{{ row.order.waybill_number }}</div>
        </div>
    </div>
    {% empty %}
    <p class="text-muted">لا توجد شحنات.</p>
    {% endfor %}
</div>
{% endblock %}
